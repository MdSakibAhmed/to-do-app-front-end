services:

  # ── Backend API ──────────────────────────────────────────────────────────────
  api-dev:
    build:
      context: ../taskr-backend
      dockerfile: Dockerfile
      target: development
    container_name: taskr-api-dev
    ports:
      - "3001:3001"
    volumes:
      - ../taskr-backend:/app
      - /app/node_modules
      - taskr-data-dev:/data
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_PATH=/data/db.json
      - CORS_ORIGIN=http://localhost:5173
    profiles:
      - dev

  api:
    build:
      context: ../taskr-backend
      dockerfile: Dockerfile
      target: production
    container_name: taskr-api
    ports:
      - "3001:3001"
    volumes:
      - taskr-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/data/db.json
      - CORS_ORIGIN=http://localhost:3000
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - prod

  # ── Frontend ─────────────────────────────────────────────────────────────────
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: taskr-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3001/api
    depends_on:
      - api-dev
    profiles:
      - dev

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: http://localhost:3001/api
    container_name: taskr-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:3001/api
    depends_on:
      - api

    #     condition: service_healthy
    # restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://localhost/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s
    profiles:
      - prod

volumes:
  taskr-data: # production JSON DB — persists across restarts
  taskr-data-dev: # dev JSON DB
