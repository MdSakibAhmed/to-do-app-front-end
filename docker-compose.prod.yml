services:
  api:
    image: salmansakib/todo-app-back-end:latest
    container_name: taskr-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/data/db.json
      - CORS_ORIGIN=http://192.168.0.107
    volumes:
      - taskr-data:/data

  app:
    image: salmansakib/to-do-app-front-end:latest
    container_name: taskr-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  taskr-data: